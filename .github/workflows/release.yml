name: Release Obsidian plugin

# Push a tag that matches the version in manifest.json, e.g.:
#   git tag -a 1.2.0 -m "What changed in this release"
#   git push origin 1.2.0
# The annotated tag's message becomes the release notes.

on:
  push:
    tags:
      - "*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write       # create the GitHub release
      id-token: write       # sign the attestation
      attestations: write   # store the attestation
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0    # full history so the annotated tag message is available

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22.x"

      - name: Check tag matches manifest version
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          version="$(node -p "require('./manifest.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "::error::Tag $tag does not match manifest.json version $version"
            exit 1
          fi

      - name: Run tests
        run: node test/run.js

      - name: Check syntax of main.js
        run: node --check main.js

      - name: Generate artifact attestation
        uses: actions/attest@v4
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          gh release create "$tag" \
            --title="$tag" \
            --notes-from-tag \
            --verify-tag \
            main.js manifest.json styles.css
